[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "converge"
version = "0.1.0"
description = "Open-source cross-account security lakehouse (Kafka/Iceberg/DuckDB)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0,<3",
    "kafka-python>=2.0,<4",
    "pyiceberg[s3fs,pyarrow]==0.7.1",
    "duckdb>=1.0,<2",
    "streamlit>=1.30,<2",
    "pyarrow>=15.0,<20",
    "boto3>=1.34,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.3",
]

[project.scripts]
converge-gen-account1 = "converge.generators.account1:main"
converge-gen-account2 = "converge.generators.account2:main"
converge-gen-account3 = "converge.generators.account3:main"
converge-normalizer = "converge.pipeline.normalizer_service:main"
converge-iceberg-writer = "converge.pipeline.iceberg_writer:main"
converge-session-state = "converge.pipeline.session_state_job:main"
converge-dashboard = "converge.dashboard.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
